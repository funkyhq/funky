# docker-compose.yml (repo root) — the funky stack: postgres + migrate +
# api + worker, all four from the topology the harness was designed around.
#
# Bring up:   FUNKY_AUTH_TOKEN=... ANTHROPIC_API_KEY=... E2B_API_KEY=... \
#             docker compose up --build           (or put them in .env)
# Scale out:  docker compose up --build --scale worker=3
# Tear down:  docker compose down                 (-v to also wipe the database)

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: funky
      POSTGRES_PASSWORD: funky
      POSTGRES_DB: funky
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U funky -d funky"]
      interval: 2s
      timeout: 2s
      retries: 15

  # One-shot: applies migrations, exits; api and worker wait for it to
  # succeed. Drizzle's journaled migrator tracks applied migrations in
  # __drizzle_migrations, so re-running on every `up` is a no-op.
  migrate:
    build: .
    command: ["node", "packages/adapters/dist/store/migrate.mjs"]
    environment:
      DATABASE_URL: postgres://funky:funky@postgres:5432/funky # ← service name, not localhost
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://funky:funky@postgres:5432/funky
      # No default credential, ever: `:?` fails the boot with a message if unset.
      FUNKY_AUTH_TOKEN: ${FUNKY_AUTH_TOKEN:?set FUNKY_AUTH_TOKEN in .env — any random string, ≥16 chars}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  # The runDriver host. No ports — nothing routes to a worker; claiming is
  # the only scheduler, so `--scale worker=N` needs no other change. There
  # is deliberately no drain path: SIGKILL is the shutdown story and an
  # interrupted step is never committed, so `restart` IS the worker's
  # lifecycle management.
  worker:
    build: .
    command: ["node", "apps/worker/dist/main.mjs"]
    environment:
      DATABASE_URL: postgres://funky:funky@postgres:5432/funky
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
      E2B_API_KEY: ${E2B_API_KEY:?set E2B_API_KEY in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
